name: Apply tracker card alias patch on staging

on:
  push:
    branches: [staging]
    paths:
      - ".github/workflows/patch-tracker-card-aliases-staging.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Patch Character Tracker card identity aliases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/server/src/routes/generate/generate-route-utils.ts")
          text = path.read_text()

          replacements = [
              (
                  '''export type TrackerCharacterCardIdentity = {\n  id: string;\n  name: string;\n  avatarPath?: string | null;\n  avatarCrop?: unknown;\n};''',
                  '''export type TrackerCharacterCardIdentity = {\n  id: string;\n  name: string;\n  aliases?: string[];\n  tags?: string[];\n  avatarPath?: string | null;\n  avatarCrop?: unknown;\n};''',
              ),
              (
                  '''      const extensions = isPlainRecord(data.extensions) ? data.extensions : null;\n\n      // Built-in assistants are application infrastructure, not ordinary''',
                  '''      const extensions = isPlainRecord(data.extensions) ? data.extensions : null;\n      const aliases = normalizeStringArray(data.tags);\n\n      // Built-in assistants are application infrastructure, not ordinary''',
              ),
              (
                  '''      identities.push({\n        id,\n        name,\n        avatarPath:''',
                  '''      identities.push({\n        id,\n        name,\n        aliases,\n        avatarPath:''',
              ),
              (
                  '''  for (const name of duplicateNames) cardsByName.delete(name);\n  const canonicalCardNamesByKey = new Map([...cardsByName].map(([key, card]) => [key, card.name]));\n\n  const matchedIds = new Set<string>();''',
                  '''  for (const name of duplicateNames) cardsByName.delete(name);\n\n  // Character Card tags are exact-match identity aliases only. Keep aliases\n  // deterministic and ambiguity-safe: if the same normalized tag belongs to\n  // more than one card, it is not eligible for tracker identity resolution.\n  // Roster cards may already carry `tags`; library-only cards expose the same\n  // values through `aliases` so attached and off-roster characters behave alike.\n  const cardsByAlias = new Map<string, TrackerCharacterCardIdentity>();\n  const duplicateAliases = new Set<string>();\n  for (const card of cards) {\n    const aliases = [...(card.aliases ?? []), ...(card.tags ?? [])];\n    for (const rawAlias of aliases) {\n      const alias = normalizeTextForMatch(rawAlias);\n      if (!alias) continue;\n      const existing = cardsByAlias.get(alias);\n      if (existing && existing.id !== card.id) duplicateAliases.add(alias);\n      else if (!existing) cardsByAlias.set(alias, card);\n    }\n  }\n  for (const alias of duplicateAliases) cardsByAlias.delete(alias);\n\n  const canonicalCardNamesByKey = new Map([...cardsByName].map(([key, card]) => [key, card.name]));\n\n  const matchedIds = new Set<string>();''',
              ),
              (
                  '''  for (const character of characters) {\n    const explicitCanonicalName = resolveExplicitCanonicalName(character.name, canonicalCardNamesByKey);\n    const card =\n      cardsById.get(trackerCharacterIdKey(character)) ??\n      cardsByName.get(trackerCharacterNameKey(character)) ??\n      (explicitCanonicalName ? cardsByName.get(normalizeTextForMatch(explicitCanonicalName)) : undefined);''',
                  '''  for (const character of characters) {\n    const explicitCanonicalName = resolveExplicitCanonicalName(character.name, canonicalCardNamesByKey);\n    const aliasCard =\n      cardsByAlias.get(normalizeTextForMatch(character.characterId)) ??\n      cardsByAlias.get(trackerCharacterNameKey(character));\n    const card =\n      cardsById.get(trackerCharacterIdKey(character)) ??\n      cardsByName.get(trackerCharacterNameKey(character)) ??\n      aliasCard ??\n      (explicitCanonicalName ? cardsByName.get(normalizeTextForMatch(explicitCanonicalName)) : undefined);''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Typecheck server
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @marinara-engine/server lint

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-tracker-card-aliases-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/routes/generate/generate-route-utils.ts .github/workflows/patch-tracker-card-aliases-staging.yml
          git commit -m "fix: resolve tracker identities from card tags"
          git push origin HEAD:staging
